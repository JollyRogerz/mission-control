# Mission Control — gitleaks configuration
#
# Purpose: make `gitleaks detect --no-git --source .` honor the project's
# .gitignore semantics (gitleaks does NOT honor .gitignore in --no-git mode).
# Without this, working-tree scans walk runtime caches and generated content
# producing false-positive findings.
#
# Maintenance rules:
#   - `[allowlist] paths` ONLY excludes runtime/generated paths that mirror
#     .gitignore semantics. Add new paths here whenever you add to .gitignore.
#   - `[allowlist.regexes]` and `[allowlist.commits]` entries require a
#     one-line justification comment per entry.

[extend]
useDefault = true

[allowlist]
description = "Mirror .gitignore exclusions"
paths = [
  # Local-only / generated content (mirror .gitignore)
  '''^\.codex-trash/.*''',
  '''^\.firecrawl/.*''',
  '''^\.claude/.*''',
  '''^\.vscode/.*''',

  # Runtime / generated content
  '''^node_modules/.*''',
  '''.*/node_modules/.*''',
  '''^\.venv/.*''',
  '''^venv/.*''',
  '''^logs/.*''',
  '''^output/.*''',
  '''^workspace/.*''',
  '''^uploads/.*''',
  '''^config/logs/.*''',
  '''^config/media/inbound/.*''',
  '''^config/cron/runs/.*''',
  '''^config/telegram/.*''',
  '''^config/settings/.*''',
  '''^config/workspace.*''',
  '''^config/canvas/dist/.*''',

  # Per-install runtime caches/identity
  '''^config/plugin-runtime-deps/.*''',
  '''^config/bridge-device-identity\.json$''',
  '''^config/identity/.*''',

  # Per-install runtime config; bootstrap regenerates from .example.
  '''^config/canvas/mission-control\.json$''',

  # Backups, sqlite sidecars, env overrides, pem keys
  '''.*\.bak.*''',
  '''.*\.db(-shm|-wal)?$''',
  '''^\.env$''',
  '''^\.env\..*''',
  '''^secrets/.*''',
  '''.*\.pem$''',

  # Python compiled artifacts
  '''.*/__pycache__/.*''',
  '''.*\.pyc$''',
  '''.*\.pyo$''',

  # OS / editor noise
  '''.*\.DS_Store$''',
  '''.*\.swp$''',
  '''.*\.swo$''',
]
