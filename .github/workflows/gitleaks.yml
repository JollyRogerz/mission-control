# Phase 05 HARDEN-03: server-side gitleaks scan
# Runs on every push to any branch and on every PR.
# Fails the build (and blocks merge when branch protection requires a passing check)
# if gitleaks detects any secrets in the diff or full tree.
#
# Uses gitleaks CLI directly (not gitleaks-action@v2) so it works on both
# individual accounts and org accounts without a paid GITLEAKS_LICENSE.

name: gitleaks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so PR scans can compare against the base ref.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --verbose
